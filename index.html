<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>AR Pascua</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

<!-- <script defer src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script> -->

</head>

<!-- <body> -->
<body style="margin:0; overflow:hidden;"></body>

<script>
console.log("MindAR:", window.MINDAR);
</script>

<a-scene
mindar-image="imageTargetSrc: targets.mind"
color-space="sRGB"
embedded
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: true"
ui-loading="enabled: true"
ui-scanning="enabled: true"
ui-error="enabled: true">

<a-assets>

<a-asset-item
id="conejo"
src="./conejo.glb">
</a-asset-item>

</a-assets>

<a-light type="ambient" intensity="1"></a-light>
<a-light type="directional" position="1 1 1"></a-light>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<a-gltf-model
src="./conejo.glb"
scale="0.4 0.4 0.4"
position="0 0 0">
</a-gltf-model>

<a-box color="yellow"></a-box>

</a-entity>

</a-scene>

</body>
</html>
